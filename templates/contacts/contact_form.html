{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">保存</button>
    <a href="/contacts/">キャンセル</a>
</form>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const titleField = document.getElementById('id_title');
        const taskTitleField = document.getElementById('id_task_title');
        let taskTitleManuallyEdited = false;
    
        if (taskTitleField) {
            taskTitleField.addEventListener('input', function() {
                taskTitleManuallyEdited = true;
            });
        }
    
        if (titleField && taskTitleField) {
            titleField.addEventListener('input', function() {
                if (!taskTitleManuallyEdited) {
                    taskTitleField.value = titleField.value;
                }
            });
        }
    });
    </script>    

{% endblock %}
