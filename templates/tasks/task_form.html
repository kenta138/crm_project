{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>

<form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next_url }}">
    {{ form.as_p }}
    <button type="submit">保存</button>
    <a href="{{ next_url }}">キャンセル</a>
</form>

{% endblock %}
