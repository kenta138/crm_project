{% extends 'base.html' %}
{% block title %}ラベル削除確認{% endblock %}
{% block content %}
<h1>ラベル削除確認</h1>
<p>「{{ category.name }}」を削除しますか？</p>
{% if label_count > 0 %}
<p style="color: red;">このラベルには{{ label_count }}件の項目が紐づいています。削除すると項目も全て削除されます。</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    <button type="submit">削除する</button>
    <a href="/labels/">キャンセル</a>
</form>
{% endblock %}
