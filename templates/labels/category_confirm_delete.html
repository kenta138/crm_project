{% extends 'base.html' %}
{% block title %}カテゴリー削除確認{% endblock %}
{% block content %}
<h1>カテゴリー削除確認</h1>
<p>「{{ category.name }}」を削除しますか？</p>
{% if label_count > 0 %}
<p style="color: red;">このカテゴリーには{{ label_count }}件のラベルが紐づいています。削除するとラベルも全て削除されます。</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    <button type="submit">削除する</button>
    <a href="/labels/">キャンセル</a>
</form>
{% endblock %}
