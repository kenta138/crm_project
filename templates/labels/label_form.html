{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">保存</button>
    <a href="/labels/">キャンセル</a>
</form>

<a href="/labels/{{ form.instance.pk }}/delete/" class="btn-delete-subtle">この項目を削除</a>
{% endblock %}
