<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CRM{% endblock %}</title>
</head>
<body>
    {% if user.is_authenticated %}
    <nav>
        <a href="/dashboard/">ダッシュボード</a> |
        <a href="/clients/">取引先一覧</a> |
        <a href="/contacts/">接触記録一覧</a> |
        <a href="/tasks/">タスク管理</a> |
        {% if user.role == 'admin' %}
        <a href="/labels/">ラベル管理</a> |
        <a href="/admin/">管理画面</a> |
        {% endif %}
        <a href="/logout/">ログアウト</a>
    </nav>
    <hr>
    {% endif %}
    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
